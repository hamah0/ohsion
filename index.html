<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오시온의 휴대폰</title>
  <!-- 레트로 픽셀 폰트 (Galmuri) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 오른쪽 위 버튼 -->
  <nav class="topbar" aria-label="휴대폰 조작">
    <button id="closeupBtn" class="tb-btn" type="button" aria-pressed="false">클로즈업</button>
    <button id="toggleBtn" class="tb-btn" type="button">폴더 열기</button>
  </nav>

  <main class="scene">
    <!-- 휴대폰 무대: 화면 크기에 맞춰 JS(closeup.js)가 확대/축소합니다 -->
    <div class="stage-wrap" id="stageWrap">
    <div class="stage closed" id="stage">
      <div class="phone is-closed" id="phone">

        <!-- ───────── 아래쪽 몸체 (키패드) ───────── -->
        <div class="body">
          <div class="hinge" id="hinge" title="폴더 닫기"></div>
          <i class="pad l"></i><i class="pad r"></i>

          <div class="keyplate">
            <!-- 방향키 + 단축키 영역 -->
            <div class="navpad">
              <button class="key corner tl" data-key="msg"  aria-label="문자">
                <svg viewBox="0 0 16 12"><rect x="1" y="1" width="14" height="10" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 1 L8 7 L15 1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
              <button class="key corner tr" data-key="video" aria-label="영상통화"><span class="video-txt">Video</span></button>
              <button class="key corner bl" data-key="lock" aria-label="잠금">
                <svg viewBox="0 0 12 16"><rect x="1" y="5" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 5 V3.5 a2.5 2.5 0 0 1 5 0 V5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="6" cy="10" r="1.3" fill="currentColor"/></svg>
              </button>
              <button class="key corner br" data-key="dmb" aria-label="DMB"><span class="dmb-txt">dmb</span></button>

              <!-- 크롬 L자 방향키 (그림) -->
              <svg class="nav-chrome" viewBox="0 0 135 108" aria-hidden="true">
                <defs>
                  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fbf7e6"/>
                    <stop offset=".35" stop-color="#bdb59a"/>
                    <stop offset=".55" stop-color="#f6f1dc"/>
                    <stop offset="1" stop-color="#8a8470"/>
                  </linearGradient>
                </defs>
                <path class="chrome-shadow" d="M67.5 6 V33 Q67.5 47.5 53 47.5 H10"/>
                <path class="chrome-shadow" d="M125 60 H82 Q68.5 60 68.5 74 V102"/>
                <path class="chrome" d="M67.5 6 V33 Q67.5 47.5 53 47.5 H10"/>
                <path class="chrome" d="M125 60 H82 Q68.5 60 68.5 74 V102"/>
              </svg>
              <!-- 실제로 누르는 투명 버튼 -->
              <button class="nav-hit up"    data-key="up"    aria-label="위"></button>
              <button class="nav-hit left"  data-key="left"  aria-label="왼쪽"></button>
              <button class="nav-hit right" data-key="right" aria-label="오른쪽"></button>
              <button class="nav-hit down"  data-key="down"  aria-label="아래"></button>
              <button class="key ok" data-key="ok" aria-label="확인">
                <svg viewBox="0 0 10 10"><path d="M3.6 2.6 L7.4 5 L3.6 7.4 Z" fill="currentColor"/></svg>
              </button>
            </div>

            <!-- 통화 / 취소 / 종료 -->
            <div class="fnrow">
              <button class="key fn" data-key="call" aria-label="통화">
                <svg viewBox="0 0 28 10"><path d="M2 8 V5 Q14 -1 26 5 V8" fill="none" stroke="#3fd45b" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
              <button class="key fn" data-key="clear" aria-label="취소">C/P</button>
              <button class="key fn" data-key="end" aria-label="종료">
                <svg viewBox="0 0 28 10"><path d="M2 8 V5 Q14 -1 26 5 V8" fill="none" stroke="#ef3b4a" stroke-width="2.4" stroke-linecap="round"/><circle cx="25" cy="1.5" r="1.2" fill="#ef3b4a"/></svg>
              </button>
            </div>

            <!-- 숫자 키패드 (JS가 채웁니다) -->
            <div class="numpad" id="numpad"></div>
          </div>
          <div class="mic"></div>
        </div>

        <!-- ───────── 위쪽 폴더 (앞: 내부 LCD / 뒤: 외부 커버) ───────── -->
        <div class="flap" id="flap">
          <!-- 열었을 때 보이는 안쪽 면 -->
          <div class="face face-in">
            <div class="speaker"></div>
            <i class="pad l"></i><i class="pad r"></i>
            <div class="inner-glass">
              <div class="brand-sky">SKY</div>
              <div class="cam"></div>
              <div class="lcd-frame">
                <div class="lcd" id="lcd"></div>
              </div>
              <div class="brand-show">SH<span class="show-o"></span>W</div>
            </div>
          </div>

          <!-- 닫았을 때 보이는 바깥 커버 -->
          <div class="face face-out" id="cover" role="button" tabindex="0" aria-label="폴더 열기">
            <div class="gloss"></div>
            <div class="cover-show">SH<span class="show-o"></span>W</div>
            <div class="oled"><div class="oled-text notice" id="oledText"><span class="oled-line oled-date">12월 24일 (목요일)</span></div></div>
            <div class="led" id="led" aria-hidden="true"></div>
            <div class="cover-sky">SKY</div>
          </div>
        </div>

      </div>
    </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/memos.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/calls.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/music.js"></script>
  <script src="js/show.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/closeup.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/phone.js"></script>
</body>
</html>
